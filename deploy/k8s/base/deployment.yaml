apiVersion: apps/v1
kind: Deployment

metadata:
  name: ${SERVICE_NAME}
  namespace: ${K8S_NAMESPACE}

  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/component: backend
    version: "${DEPLOY_VERSION}"

spec:
  replicas: ${REPLICAS}

  selector:
    matchLabels:
      app.kubernetes.io/instance: ${SERVICE_NAME}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/instance: ${SERVICE_NAME}
        app.kubernetes.io/component: backend
        version: "${DEPLOY_VERSION}"

    spec:
      serviceAccountName: ${SERVICE_NAME}

      containers:
        - name: ${SERVICE_NAME}

          image: ${IMAGE_REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG}

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: ${CONTAINER_PORT}

          env:
            - name: SERVICE_NAME
              value: "${SERVICE_NAME}"

            - name: SERVICE_PORT
              value: "${CONTAINER_PORT}"

            - name: ENVIRONMENT
              value: "${ENVIRONMENT}"

          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}

            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}

          readinessProbe:
            httpGet:
              path: ${READINESS_PATH}
              port: ${CONTAINER_PORT}
            initialDelaySeconds: ${READINESS_INITIAL_DELAY_SECONDS}
            periodSeconds: ${READINESS_PERIOD_SECONDS}
            timeoutSeconds: ${READINESS_TIMEOUT_SECONDS}

          livenessProbe:
            httpGet:
              path: ${HEALTH_PATH}
              port: ${CONTAINER_PORT}
            initialDelaySeconds: ${LIVENESS_INITIAL_DELAY_SECONDS}
            periodSeconds: ${LIVENESS_PERIOD_SECONDS}
            timeoutSeconds: ${LIVENESS_TIMEOUT_SECONDS}
