name: Microservice CI/CD (ECS)
on:
  push:
    branches: ["main"]
    paths: ["app-examples/microservice/**"]
  pull_request:
    branches: ["main"]
    paths: ["app-examples/microservice/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  deployments: write
  security-events: write

env:
  AWS_REGION: ap-south-1
  CONTAINER_NAME: microservice-container

concurrency:
  group: microservice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-examples/microservice/package-lock.json
      - name: Install dependencies
        working-directory: app-examples/microservice
        run: npm ci
      - name: Run tests
        working-directory: app-examples/microservice
        run: npm test

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    outputs:
      image: ${{ steps.build.outputs.image }}  # ✅ FIXED: Valid job-level context
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push Docker image
        id: build  # ✅ REQUIRED for outputs reference
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_MICROSERVICE }}
          TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$REGISTRY/$REPO:$TAG" \
            -t "$REGISTRY/$REPO:latest" \
            --push \
            ./app-examples/microservice
          echo "image=$REGISTRY/$REPO:$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Debug image from build
        run: echo "IMAGE_FROM_BUILD='${{ needs.build.outputs.image }}'"
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_MICROSERVICE }} \
            --query taskDefinition > task-def.json
      - name: Render new task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}  # ✅ CORRECT context
      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_MICROSERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
      - name: Service stable
        run: |
          echo "✅ Service deployed successfully"
          aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE_MICROSERVICE }} \
            --query 'services[0].deployments[0].status'

  notify:
    name: Slack on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [test, build, deploy]
    steps:
      - name: Send Slack alert
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: failure
          fields: repo,message,commit,author,action,workflow












