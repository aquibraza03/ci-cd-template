name: 🌐 Frontend CI/CD Enterprise (AWS-Aligned)

on:
  push:
    branches: ["main"]
    paths:
      - "app-examples/frontend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "app-examples/frontend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  NODE_VERSION: 20
  AWS_REGION: ap-south-1
  BUILD_DIR: dist
  FRONTEND_HEALTH_URL: https://app.examples.com

jobs:

# =====================================================
# Detect build directory
# =====================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.meta.outputs.build_dir }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          if [ -f "app-examples/frontend/next.config.js" ]; then
            echo "build_dir=app-examples/frontend/out" >> $GITHUB_OUTPUT
          elif [ -d "app-examples/frontend/dist" ]; then
            echo "build_dir=app-examples/frontend/dist" >> $GITHUB_OUTPUT
          elif [ -d "app-examples/frontend/build" ]; then
            echo "build_dir=app-examples/frontend/build" >> $GITHUB_OUTPUT
          else
            echo "build_dir=app-examples/frontend/dist" >> $GITHUB_OUTPUT
          fi

# =====================================================
# Test
# =====================================================
  test:
    runs-on: ubuntu-latest
    needs: detect

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
        continue-on-error: true

      - run: |
          cd app-examples/frontend
          npm install
          npm run lint --if-present
          npm test --if-present -- --coverage || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: app-examples/frontend/coverage/
          if-no-files-found: ignore

# =====================================================
# Build
# =====================================================
  build:
    runs-on: ubuntu-latest
    needs: [detect, test]
    outputs:
      build_dir: ${{ needs.detect.outputs.build_dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
        continue-on-error: true

      - run: |
          cd app-examples/frontend
          npm install
          npm run build
          if [ -f "next.config.js" ]; then
            npx next export
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ needs.detect.outputs.build_dir }}

# =====================================================
# Preview Deploy (Vercel / Netlify)
# =====================================================
  preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Vercel Preview
        if: env.VERCEL_TOKEN != ''
        run: |
          npm i -g vercel
          vercel deploy --prebuilt --token=$VERCEL_TOKEN --yes

      - name: Netlify Preview
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npm i -g netlify-cli
          netlify deploy --dir=dist --auth=$NETLIFY_AUTH_TOKEN

# =====================================================
# Production Deploy (AWS S3 + CloudFront) - FIXED!
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ env.FRONTEND_HEALTH_URL }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      # =====================================================
      # FRESH OIDC AUTH + DEBUG
      # =====================================================
      - name: Configure AWS Credentials
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: DEBUG - Verify Secrets & Auth
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
        run: |
          echo "✅ Role: ${{ secrets.AWS_GITHUB_ROLE }}"
          echo "✅ Bucket: ${{ secrets.S3_PROD_BUCKET }}"
          echo "✅ CF Dist: ${{ secrets.CLOUDFRONT_DISTRIBUTION }}"
          aws sts get-caller-identity
          aws s3 ls s3://${{ secrets.S3_PROD_BUCKET }}/ --region ap-south-1 || echo "Bucket empty OK"

      # =====================================================
      # SINGLE-LINE S3 SYNC (NO MORE MULTI-LINE BUG!)
      # =====================================================
      - name: Upload to S3 - Static Assets
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
        run: aws s3 sync dist/ s3://${{ secrets.S3_PROD_BUCKET }}/ --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --region ap-south-1

      - name: Upload to S3 - HTML Files
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
        run: aws s3 sync dist/ s3://${{ secrets.S3_PROD_BUCKET }}/ --cache-control "no-cache" --include "*.html" --region ap-south-1

      # =====================================================
      # CLOUDFRONT INVALIDATION
      # =====================================================
      - name: CloudFront Invalidation
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*" \
            --region us-east-1

      - name: Verify frontend health
        timeout-minutes: 5
        run: curl -f --max-time 30 ${{ env.FRONTEND_HEALTH_URL }} || echo "Health check optional"

      - name: Slack success notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: success
          fields: repo,commit,author,workflow

# =====================================================
# Failure Alert
# =====================================================
  notify-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [detect, test, build, preview, deploy]

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Slack failure alert
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        with:
          status: failure
          fields: repo,message,commit,author,workflow









